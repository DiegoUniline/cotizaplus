<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: letter; margin: 14mm; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; color: #222; }
  table { border-collapse: collapse; width: 100%; }
  td { vertical-align: top; }
  .emp { font-size: 15px; color: #13233a; }
  .tit { font-size: 22px; font-weight: bold; color: #1f6feb; text-align: right; letter-spacing: 1px; }
  .meta { width: auto; margin-left: auto; margin-top: 6px; }
  .meta td { padding: 2px 0 2px 14px; text-align: right; }
  .lbl { font-size: 9px; color: #6b7785; text-transform: uppercase; letter-spacing: .5px; }
  .box { border: 1px solid #d9dee5; padding: 8px 10px; margin: 14px 0; }
  .it th { background: #13233a; color: #fff; padding: 6px; font-size: 10px; text-align: left; }
  .it td { padding: 6px; border-bottom: 1px solid #e3e8ee; }
  .r { text-align: right !important; }
  .tot { width: 260px; margin-left: auto; margin-top: 10px; }
  .tot td { padding: 4px 6px; }
  .tot .t td { font-size: 13px; font-weight: bold; border-top: 2px solid #13233a; }
  .cond { margin-top: 18px; font-size: 9.5px; color: #444; }
  .firma { margin-top: 28px; }
</style>
</head>
<body>
<? var c = d.cot, cl = d.cliente, cur = c.Moneda || 'MXN'; ?>
<table>
  <tr>
    <td style="width:55%">
      <? if (logo) { ?><img src="<?= logo ?>" style="max-height:60px;max-width:200px"><br><? } ?>
      <b class="emp"><?= cfg.EMPRESA_NOMBRE ?></b><br>
      <? if (cfg.EMPRESA_RFC) { ?>RFC: <?= cfg.EMPRESA_RFC ?><br><? } ?>
      <? if (cfg.EMPRESA_DIRECCION) { ?><?= cfg.EMPRESA_DIRECCION ?><br><? } ?>
      <?= [cfg.EMPRESA_TELEFONO, cfg.EMPRESA_EMAIL].filter(Boolean).join(' · ') ?>
    </td>
    <td>
      <div class="tit">COTIZACIÓN</div>
      <table class="meta">
        <tr><td class="lbl">Folio</td><td><b><?= c.Folio ?></b></td></tr>
        <tr><td class="lbl">Fecha</td><td><?= fd(c.Fecha) ?></td></tr>
        <tr><td class="lbl">Vigencia</td><td><?= fd(c.Vigencia) ?></td></tr>
        <tr><td class="lbl">Moneda</td><td><?= cur ?></td></tr>
      </table>
    </td>
  </tr>
</table>

<div class="box">
  <div class="lbl">Cliente</div>
  <b><?= cl.Nombre ?></b><? if (cl.Empresa) { ?> · <?= cl.Empresa ?><? } ?><br>
  <? if (cl.RFC) { ?>RFC: <?= cl.RFC ?><br><? } ?>
  <? if (cl.Direccion) { ?><?= cl.Direccion ?><br><? } ?>
  <?= [cl.Telefono, cl.Email].filter(Boolean).join(' · ') ?>
</div>

<table class="it">
  <tr>
    <th style="width:22px">#</th><th>Descripción</th><th class="r">Cant.</th><th>Unidad</th>
    <th class="r">P. unitario</th><th class="r">Desc.</th><th class="r">Importe</th>
  </tr>
  <? d.partidas.forEach(function (p, i) { ?>
  <tr>
    <td><?= i + 1 ?></td>
    <td><?= p.Descripcion ?></td>
    <td class="r"><?= p.Cantidad ?></td>
    <td><?= p.Unidad ?></td>
    <td class="r"><?= money(p.PrecioUnitario) ?></td>
    <td class="r"><?= Number(p.DescuentoPct) ? p.DescuentoPct + '%' : '' ?></td>
    <td class="r"><?= money(p.Importe) ?></td>
  </tr>
  <? }); ?>
</table>

<table class="tot">
  <tr><td>Subtotal</td><td class="r"><?= money(c.Subtotal) ?></td></tr>
  <? if (Number(c.Descuento)) { ?><tr><td>Descuento</td><td class="r">-<?= money(c.Descuento) ?></td></tr><? } ?>
  <tr><td>IVA <?= c.TasaIVA ?>%</td><td class="r"><?= money(c.IVA) ?></td></tr>
  <tr class="t"><td>Total <?= cur ?></td><td class="r"><?= money(c.Total) ?></td></tr>
</table>

<? if (c.Condiciones) { ?>
<div class="cond"><b>Condiciones</b><br><?!= esc(c.Condiciones).replace(/\n/g, '<br>') ?></div>
<? } ?>

<div class="firma">Atentamente,<br><b><?= c.Vendedor ?></b><br><?= cfg.EMPRESA_NOMBRE ?></div>
</body>
</html>
