<style>
  :root { --bg:#f4f6f9; --card:#fff; --tx:#1d2733; --mu:#6b7785; --bd:#e3e8ee; --pri:#1f6feb; --pri2:#1858c4; --ok:#1a7f37; --bad:#cf222e; --warn:#bf8700; --nav:#13233a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--tx); }
  header { background: var(--nav); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 16px; position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 12px 8px 12px 0; }
  header h1 span { color: #5fb3ff; }
  nav { display: flex; gap: 2px; overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: #c9d6e5; padding: 14px 12px; }
  nav button:hover { background: rgba(255,255,255,.06); }
  nav button.on { color: #fff; border-color: #5fb3ff; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0; font-size: 20px; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input { max-width: 320px; }
  .toolbar select { max-width: 220px; }
  .sp { flex: 1; }
  button, .btn { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--bd); background: #fff; color: var(--tx); cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover { background: #f0f3f7; }
  button:disabled { opacity: .6; cursor: wait; }
  button.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
  button.pri:hover { background: var(--pri2); }
  button.ok { color: var(--ok); border-color: var(--ok); }
  button.bad { color: var(--bad); border-color: var(--bad); }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--bd); border-radius: 8px; width: 100%; background: #fff; color: var(--tx); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #9cc3ff; border-color: var(--pri); }
  label { display: block; font-size: 12px; color: var(--mu); margin-bottom: 10px; }
  label > input, label > select, label > textarea { margin-top: 4px; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--tx); }
  label.chk input { width: auto; margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: middle; }
  th { font-size: 12px; color: var(--mu); font-weight: 600; }
  .list tbody tr { cursor: pointer; }
  .list tbody tr:hover { background: #f7f9fc; }
  .num { text-align: right; white-space: nowrap; }
  .muted, small { color: var(--mu); }
  .late { color: var(--bad); font-weight: 600; }
  .today { color: var(--warn); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #fff; background: #8b949e; white-space: nowrap; }
  .b-borrador { background: #8b949e; }
  .b-enviada { background: #1f6feb; }
  .b-en-seguimiento { background: #bf8700; }
  .b-aceptada { background: #1a7f37; }
  .b-rechazada { background: #cf222e; }
  .b-vencida { background: #6e40c9; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi { margin: 0; }
  .kpi .v { font-size: 28px; font-weight: 700; }
  .kpi.warn .v { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid2 .full { grid-column: 1 / -1; }
  .bar { display: grid; grid-template-columns: 120px 1fr 32px 120px; gap: 8px; align-items: center; margin: 8px 0; }
  .bar div { background: #eef1f5; border-radius: 6px; height: 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar small { text-align: right; }
  .grid-cot { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .form5 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr .7fr; gap: 10px; }
  .row { display: flex; gap: 6px; margin-top: 4px; }
  .row select { margin: 0; }
  .scroll { overflow-x: auto; }
  .lines td { padding: 4px; }
  .lines input { padding: 6px 8px; }
  .x { border: 0; background: none; color: var(--bad); font-size: 18px; padding: 4px 8px; }
  .tot { margin: 12px 0 16px auto; max-width: 320px; }
  .tot div { display: flex; justify-content: space-between; padding: 4px 0; }
  .tot .big { font-size: 18px; font-weight: 700; border-top: 2px solid var(--tx); margin-top: 4px; padding-top: 8px; }
  .timeline { list-style: none; padding: 0; margin: 16px 0 0; }
  .timeline li { border-left: 3px solid var(--bd); padding: 0 0 14px 14px; position: relative; }
  .timeline li:before { content: ""; position: absolute; left: -7px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--pri); }
  .timeline p { margin: 2px 0; white-space: pre-wrap; }
  #modal { position: fixed; inset: 0; background: rgba(10,20,30,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; z-index: 20; }
  #modal[hidden] { display: none; }
  .dlg { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 540px; }
  .acts { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--nav); color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
  #loader { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: #5fb3ff; z-index: 40; transition: width .6s; }
  #loader.on { width: 85%; }
  @media (max-width: 900px) {
    .grid2, .grid-cot { grid-template-columns: 1fr; }
    .form5 { grid-template-columns: 1fr 1fr; }
    .form5 label:first-child { grid-column: 1 / -1; }
    .hm { display: none; }
    .bar { grid-template-columns: 100px 1fr 28px; }
    .bar small { display: none; }
  }
</style>
